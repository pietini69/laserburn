[package]
name = "laser_burn"
version = "1.1.0"
edition = "2021"
authors = ["Niko Pietinen"]
description = "Modern, high-performance laser cutting & engraving CAM software, featuring LightBurn .lbrn2 compatibility, vector optimization, image dithering, and multi-controller support (GRBL, Ruida)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
roxmltree = "0.20"
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
pollster = { version = "0.4", optional = true }
ttf-parser = "0.25"
miniz_oxide = "0.8"
serialport = { version = "4.10.1", default-features = false }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:pollster"]

[lib]
name = "laser_burn"
path = "src/lib.rs"

[[bin]]
name = "laser_burn"
path = "src/main.rs"
