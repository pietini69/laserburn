name: Build PhotonCAM Pi OS Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-pi-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install zig & cargo-zigbuild
        run: |
          pip install cargo-zigbuild
          sudo snap install zig --classic --beta || sudo apt-get install -y zig || true

      - name: Compile PhotonCAM Bridge for ARM64
        run: |
          cargo zigbuild --release --bin photoncam-bridge --target aarch64-unknown-linux-gnu.2.31 --no-default-features
          ls -lh target/aarch64-unknown-linux-gnu/release/photoncam-bridge
          cp target/aarch64-unknown-linux-gnu/release/photoncam-bridge .github/scripts/photoncam-bridge

      - name: Modify Raspberry Pi OS Image
        uses: dtcooper/rpi-image-modifier@v1
        id: modifier
        with:
          base-image-url: 'https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz'
          script-path: '.github/scripts/customize-pi.sh'
          image-path: 'PhotonCAM-Pi-OS-arm64.img'
          compress-with-xz: 'true'
          shrink: 'true'

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCAM-Pi-OS-arm64
          path: PhotonCAM-Pi-OS-arm64.img.xz

      - name: Attach Image to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotonCAM-Pi-OS-arm64.img.xz
